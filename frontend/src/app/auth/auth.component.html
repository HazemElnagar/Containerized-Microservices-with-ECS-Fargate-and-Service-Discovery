<div class="glass-panel animate-fade-in" style="max-width: 400px; margin: 4rem auto;">
  <h2 class="text-gradient" style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
  
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        class="input-field" 
        [(ngModel)]="email" 
        name="email" 
        placeholder="you@example.com"
        required>
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        class="input-field" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="••••••••"
        required>
    </div>

    <div *ngIf="error" style="color: var(--danger-color); margin-bottom: 1rem; font-size: 0.9rem;">
      {{ error }}
    </div>

    <button type="submit" class="btn-primary" style="width: 100%" [disabled]="isLoading">
      <span *ngIf="!isLoading">Sign In</span>
      <span *ngIf="isLoading">Authenticating...</span>
    </button>
  </form>
</div>
